name: BG1 alarm delivery proof (synthetic, PR only)

on:
  # Synthetic delivery probe runs on a tightly scoped same-repo branch push:
  # the actual pull_request event returned HTTP 403 when posting despite its
  # announced issues:write. A branch push is closer to main's trusted schedule
  # workflow token and never makes a Production database call.
  push:
    branches:
      - feat/official-truth-universal-source-registry-dev-20261119

permissions:
  contents: read
  issues: write

concurrency:
  group: bg1-alarm-delivery-proof-pr-1254
  cancel-in-progress: false

jobs:
  delivery-proof:
    if: >-
      github.repository == 'Jetnity/jetnity' &&
      github.event.repository.private == false &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/feat/official-truth-universal-source-registry-dev-20261119'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Synthetic GitHub bot comment delivery and exact readback (never Production)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_PULL_REQUEST_NUMBER: '1254'
        run: node scripts/official-truth-bg1-alarm-delivery-proof.mjs
