name: BG1 legacy anon offline Dev proof
on:
  push:
    branches:
      - fix/bg1-alarm-legacy-anon-dev-20261121
permissions:
  contents: read
concurrency:
  group: bg1-legacy-anon-offline-dev
  cancel-in-progress: true
jobs:
  validate:
    if: >-
      github.repository == 'Jetnity/jetnity' &&
      github.ref == 'refs/heads/fix/bg1-alarm-legacy-anon-dev-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Offline syntax and key-contract tests (no Prod secrets or external calls)
        run: |
          node --check scripts/official-truth-bg1-five-minute-integrity-alarm.mjs
          node --test scripts/official-truth-bg1-five-minute-integrity-alarm.test.mjs
      - name: Live read-only legacy anon key transport proof (one public BG1 RPC, no notifications)
        env:
          JETNITY_BG1_PROD_ANON_KEY: ${{ secrets.JETNITY_BG1_PROD_ANON_KEY }}
        run: |
          node --input-type=module <<'BG1_READ_ONLY_PROOF'
          const REF='qscbgcdmivbbnzrcyegn'
          const key=process.env.JETNITY_BG1_PROD_ANON_KEY
          const fail=reason=>{process.stderr.write('BG1_READ_ONLY_PROBE_REFUSED:'+reason+'\n');process.exitCode=1}
          function legacyAnon(k){
            if(typeof k!=='string'||k.length<100||k.length>4096)return false
            try{
              const parts=k.split('.')
              if(parts.length!==3)return false
              const blobs=parts.map((p,i)=>{
                if(!/^[A-Za-z0-9_-]+$/.test(p))throw Error('invalid')
                const b=Buffer.from(p,'base64url')
                if(b.length>[512,2048,32][i]||b.toString('base64url')!==p)throw Error('invalid')
                return b
              })
              if(blobs[2].length!==32)return false
              const [h,c]=blobs.slice(0,2).map(b=>{
                const s=new TextDecoder('utf-8',{fatal:true}).decode(b)
                const v=JSON.parse(s)
                return JSON.stringify(v)===s?v:null
              })
              const exact=(v,keys)=>v!==null&&typeof v==='object'&&!Array.isArray(v)
                &&Object.keys(v).length===keys.length&&keys.every(k=>Object.hasOwn(v,k))
              const now=Math.floor(Date.now()/1000)
              return exact(h,['alg','typ'])&&h.alg==='HS256'&&h.typ==='JWT'
                &&exact(c,['iss','ref','role','iat','exp'])
                &&c.iss==='supabase'&&c.ref===REF&&c.role==='anon'
                &&Number.isSafeInteger(c.iat)&&c.iat>0&&c.iat<=now
                &&Number.isSafeInteger(c.exp)&&c.exp>now&&c.exp>c.iat
            }catch{return false}
          }
          if(!legacyAnon(key))fail('missing_or_nonpublic_anon')
          else{
            const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),10000)
            try{
              const response=await fetch('https://'+REF+'.supabase.co/rest/v1/rpc/jetnity_bg1_alarm_kind_v2',{
                method:'POST',redirect:'error',cache:'no-store',credentials:'omit',signal:ctrl.signal,
                headers:{apikey:key,'Content-Type':'application/json',Accept:'application/json'},body:'{}'})
              if(response.redirected||response.status!==200||
                 !/^application\/json\b/i.test(response.headers.get('content-type')||''))throw Error('rpc_http_or_type')
              const contentLength=response.headers.get('content-length')
              if(contentLength&&Number(contentLength)>4096)throw Error('oversize')
              const reader=response.body?.getReader()
              if(!reader)throw Error('empty')
              const chunks=[];let bytes=0
              for(;;){
                const chunk=await reader.read()
                if(chunk.done)break
                if(!(chunk.value instanceof Uint8Array))throw Error('invalid')
                bytes+=chunk.value.byteLength
                if(bytes>4096)throw Error('oversize')
                chunks.push(chunk.value)
              }
              const data=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(Buffer.concat(chunks,bytes)))
              if(!data||typeof data!=='object'||Array.isArray(data)
               ||Object.keys(data).sort().join(',')!=='incidentGeneration,schema,status'
               ||data.schema!==1
               ||!['current','temporarily_unavailable','integrity_locked'].includes(data.status)
               ||!Number.isSafeInteger(data.incidentGeneration)||data.incidentGeneration<0
               ||(data.status!=='integrity_locked'&&data.incidentGeneration!==0))
                throw Error('rpc_shape')
              process.stdout.write('BG1_LEGACY_ANON_REAL_RPC_READ_OK:'+data.status+'\n')
            }catch{fail('transport_or_response')}
            finally{clearTimeout(timer);ctrl.abort()}
          }
          BG1_READ_ONLY_PROOF
