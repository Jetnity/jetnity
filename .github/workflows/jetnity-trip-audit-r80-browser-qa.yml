# R80 — disposable synthetic Trip Audit browser QA.
# Runs only for Jetnity/jetnity pull requests whose head is
# test/trip-audit-r80-isolated-browser-qa. Checks out the frozen #955
# product SHA, never this QA branch and never GitHub's pull-request merge ref.
# No secrets, no artifact upload, no workflow_dispatch, no product-code edits.
name: Trip Audit R80 isolated browser QA

on:
  pull_request:
    branches:
      - main
    # Doc-only evidence updates must not start another browser run.
    paths:
      - .github/workflows/jetnity-trip-audit-r80-browser-qa.yml

permissions:
  contents: read

jobs:
  synthetic-browser:
    name: Synthetic localhost browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'Jetnity/jetnity' && github.event.pull_request.head.ref == 'test/trip-audit-r80-isolated-browser-qa'
    env:
      FROZEN_SHA: fffc9e52e7345a96e276d926ff796a2c9feeb251
      FROZEN_UI_TEST_BLOB: 8db0e13c1feb42e47d5d53bde32bfab1bd06594b
      R80_PORT: "4173"
      JETNITY_UI_AUDIT: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout frozen product SHA
        uses: actions/checkout@v4
        with:
          repository: Jetnity/jetnity
          ref: fffc9e52e7345a96e276d926ff796a2c9feeb251
          fetch-depth: 1
          persist-credentials: false

      - name: Assert checkout is the frozen SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "checked_out_sha=${actual}"
          echo "checked_out_tree=$(git rev-parse HEAD^{tree})"
          echo "event_sha=${GITHUB_SHA}"
          echo "event_ref=${GITHUB_REF}"
          if [ "${actual}" != "${FROZEN_SHA}" ]; then
            echo "FAIL: checkout is not the frozen #955 SHA"
            exit 1
          fi
          if [ "${GITHUB_SHA}" = "${actual}" ]; then
            echo "FAIL: event SHA matches the checkout; expected the PR merge ref to differ from the pinned product SHA"
            exit 1
          fi
          case "${GITHUB_REF}" in
            refs/pull/*/merge) ;;
            *)
              echo "FAIL: expected a pull_request merge ref, got ${GITHUB_REF}"
              exit 1
              ;;
          esac
          blob="$(git rev-parse "HEAD:lib/trips/trip-audit-v1/ui.test.ts")"
          echo "ui_test_blob=${blob}"
          if [ "${blob}" != "${FROZEN_UI_TEST_BLOB}" ]; then
            echo "FAIL: ui.test.ts blob does not match the reviewed #955 file"
            exit 1
          fi
          if [ -n "$(git status --porcelain=v1)" ]; then
            echo "FAIL: checkout worktree is dirty"
            git status --porcelain=v1
            exit 1
          fi

      - name: Refuse Next env files
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${VERCEL_ENV:-}" ]; then
            echo "FAIL: VERCEL_ENV is set"
            exit 1
          fi
          found=0
          for file in .env .env.local .env.development .env.development.local .env.production .env.production.local .env.test .env.test.local; do
            if [ -e "${file}" ]; then
              echo "FAIL: refusing to start while ${file} is present"
              found=1
            fi
          done
          if [ "${found}" -ne 0 ]; then
            exit 1
          fi
          test -f .env.example
          echo "next_loaded_env_files=absent"

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          git diff --exit-code -- package.json package-lock.json

      - name: Install Playwright Chromium when absent
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node <<'NODE'
          const fs = require('node:fs')
          const { chromium } = require('playwright')
          const executable = chromium.executablePath()
          if (fs.existsSync(executable)) {
            console.log('playwright_chromium=present')
            process.exit(0)
          }
          console.log('playwright_chromium=absent')
          process.exit(2)
          NODE
          status=$?
          set -e
          if [ "${status}" -eq 0 ]; then
            exit 0
          fi
          if [ "${status}" -ne 2 ]; then
            echo "FAIL: could not read the Playwright Chromium path"
            exit "${status}"
          fi
          npx playwright install --with-deps chromium

      - name: Fail if Chromium cannot launch
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright')
          ;(async () => {
            const browser = await chromium.launch({ headless: true })
            await browser.close()
            console.log('playwright_chromium_launch=ok')
          })().catch((error) => {
            console.error('FAIL: Chromium launch failed')
            console.error(error && error.message ? error.message : error)
            process.exit(1)
          })
          NODE

      - name: Start loopback audit server
        shell: bash
        run: |
          set -euo pipefail
          unset VERCEL_ENV
          export JETNITY_UI_AUDIT=true
          export NEXT_TELEMETRY_DISABLED=1
          set -m
          npm run dev -- --hostname 127.0.0.1 --port "${R80_PORT}" > /tmp/r80-next-dev.log 2>&1 < /dev/null &
          echo $! > /tmp/r80-next-dev.pid
          echo "dev_pid=$(cat /tmp/r80-next-dev.pid)"

      - name: Require HTTP 200 from the local audit route
        shell: bash
        run: |
          set -euo pipefail
          pid="$(cat /tmp/r80-next-dev.pid)"
          deadline=$((SECONDS + 300))
          code="000"
          while [ "${SECONDS}" -lt "${deadline}" ]; do
            if ! kill -0 "${pid}" 2>/dev/null; then
              echo "FAIL: loopback server exited before HTTP 200"
              tail -n 80 /tmp/r80-next-dev.log || true
              exit 1
            fi
            code="$(curl -sS --max-redirs 0 --max-time 60 -o /tmp/r80-audit-body.txt -w '%{http_code}' "http://127.0.0.1:${R80_PORT}/ui-audit/trip-workspace" || true)"
            echo "audit_http=${code}"
            case "${code}" in
              200) exit 0 ;;
              000|"") sleep 2 ;;
              *)
                echo "FAIL: audit route returned ${code}"
                tail -n 80 /tmp/r80-next-dev.log || true
                exit 1
                ;;
            esac
          done
          echo "FAIL: audit route did not return 200"
          tail -n 80 /tmp/r80-next-dev.log || true
          exit 1

      - name: Run existing browser test and require 1 pass, 0 skip
        shell: bash
        run: |
          set -euo pipefail
          unset VERCEL_ENV
          set +e
          TRIP_AUDIT_UI_URL="http://localhost:${R80_PORT}" \
            node --import ./scripts/server-only-test-register.mjs --import tsx --test lib/trips/trip-audit-v1/ui.test.ts \
            > /tmp/r80-ui-test.tap 2>&1
          test_status=$?
          set -e
          echo "test_exit=${test_status}"
          cat /tmp/r80-ui-test.tap
          value() {
            grep -E "^# $1 " /tmp/r80-ui-test.tap | tail -n 1 | awk '{print $3}'
          }
          tests="$(value tests)"
          pass="$(value pass)"
          fail="$(value fail)"
          skipped="$(value skipped)"
          cancelled="$(value cancelled)"
          todo="$(value todo)"
          echo "tap_tests=${tests}"
          echo "tap_pass=${pass}"
          echo "tap_fail=${fail}"
          echo "tap_skipped=${skipped}"
          echo "tap_cancelled=${cancelled}"
          echo "tap_todo=${todo}"
          if [ "${test_status}" -ne 0 ]; then
            echo "FAIL: browser test process exited ${test_status}"
            exit 1
          fi
          if [ "${tests}" != "1" ] || [ "${pass}" != "1" ] || [ "${fail}" != "0" ] || [ "${skipped}" != "0" ] || [ "${cancelled}" != "0" ] || [ "${todo}" != "0" ]; then
            echo "FAIL: expected TAP tests=1 pass=1 fail=0 skipped=0 cancelled=0 todo=0"
            exit 1
          fi
          if grep -E '^(not ok|# SKIP)|# SKIP' /tmp/r80-ui-test.tap >/dev/null; then
            echo "FAIL: TAP contains a failed or skipped test"
            exit 1
          fi
          if ! grep -F 'T09: shared guest/account Workspace keyboard, pagination, 320px and 200% browser layout' /tmp/r80-ui-test.tap >/dev/null; then
            echo "FAIL: T09 browser test did not appear in TAP"
            exit 1
          fi
          if grep -F 'NOT VERIFIED' /tmp/r80-ui-test.tap >/dev/null; then
            echo "FAIL: TAP contains NOT VERIFIED"
            exit 1
          fi
          echo "synthetic_browser_tap=1_pass_0_skip"

      - name: Stop loopback server
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/r80-next-dev.pid ]; then
            pid="$(cat /tmp/r80-next-dev.pid)"
            kill -TERM "-${pid}" 2>/dev/null || kill -TERM "${pid}" 2>/dev/null || true
            sleep 1
            kill -KILL "-${pid}" 2>/dev/null || kill -KILL "${pid}" 2>/dev/null || true
            echo "dev_server_stopped=${pid}"
          else
            echo "dev_server_stopped=not_started"
          fi
