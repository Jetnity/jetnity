name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # fetch-depth: 0 is required so the operating-mode guard can compute the
      # exact PR-vs-base file list locally. GitHub's default shallow clone does
      # not contain the base SHA, and the guard must not use network APIs,
      # secrets, providers or paid services.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      # Bricht ab, wenn package-lock.json nicht zu package.json passt.
      - name: Install dependencies
        run: npm ci

      - name: Setup check
        run: npm run check:setup:ci

      - name: Operating mode
        env:
          JETNITY_OPERATING_MODE_EVENT: ${{ github.event_name }}
          JETNITY_OPERATING_MODE_REF: ${{ github.head_ref || github.ref_name }}
          JETNITY_OPERATING_MODE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          JETNITY_OPERATING_MODE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run check:operating-mode

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test:core

      # Der Bereichsschutz für Seiten liegt im Layout der Gruppe `(admin)` und
      # gilt dort automatisch. API-Routen haben kein Layout und müssen selbst
      # prüfen – diese Kontrolle stellt sicher, dass keine ungeschützt bleibt.
      - name: Schutz der Admin-API
        run: npm run check:api-schutz

      # Findet Zugriffe auf Tabellen und RPCs, die es im Schema nicht gibt.
      # Liest nur types/supabase.ts und braucht deshalb keinen Datenbankzugang.
      - name: Bezug auf das Schema
        run: npm run check:schema-bezug

      # Halten den Baum frei von Code und Paketen, die niemand mehr erreicht.
      # Bewusste Ausnahmen sind in den Skripten mit Grund hinterlegt.
      - name: Unerreichbarer Code
        run: npm run check:dead

      - name: Exporte ohne Aufrufer
        run: npm run check:exports

      - name: Ungenutzte Pakete
        run: npm run check:deps

      - name: Production build
        run: npm run build

  persisted_native:
    name: Persisted canonical read — native
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      # fetch-depth: 0 is required so the operating-mode guard can compute the
      # exact PR-vs-base file list locally. GitHub's default shallow clone does
      # not contain the base SHA, and the guard must not use network APIs,
      # secrets, providers or paid services.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      # Bricht ab, wenn package-lock.json nicht zu package.json passt.
      - name: Install dependencies
        run: npm ci

      - name: Setup check
        run: npm run check:setup:ci

      - name: Operating mode
        env:
          JETNITY_OPERATING_MODE_EVENT: ${{ github.event_name }}
          JETNITY_OPERATING_MODE_REF: ${{ github.head_ref || github.ref_name }}
          JETNITY_OPERATING_MODE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          JETNITY_OPERATING_MODE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run check:operating-mode

      - name: Persisted native proof
        run: npm run test:persisted-native

  refresh_native:
    name: Atomic version refresh — native
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      # Same exact-ref guard and isolated standard runner as the existing proof.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup check
        run: npm run check:setup:ci

      - name: Operating mode
        env:
          JETNITY_OPERATING_MODE_EVENT: ${{ github.event_name }}
          JETNITY_OPERATING_MODE_REF: ${{ github.head_ref || github.ref_name }}
          JETNITY_OPERATING_MODE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          JETNITY_OPERATING_MODE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run check:operating-mode

      - name: Atomic refresh native proof
        run: npm run test:refresh-native

  accepted_store_native:
    name: Accepted store trip integration — native (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [store, lifecycle]

    steps:
      # Same exact-ref guard and isolated standard runner as the existing proof.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup check
        run: npm run check:setup:ci

      - name: Operating mode
        env:
          JETNITY_OPERATING_MODE_EVENT: ${{ github.event_name }}
          JETNITY_OPERATING_MODE_REF: ${{ github.head_ref || github.ref_name }}
          JETNITY_OPERATING_MODE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          JETNITY_OPERATING_MODE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run check:operating-mode

      - name: Accepted store native proof
        run: npm run test:accepted-store-native:${{ matrix.group }}

  official_truth_v3_ui:
    name: Official truth V3 — isolated UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      JETNITY_U1_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Bind synthetic evidence to this run and checkout
        run: node scripts/official-truth-product-v3-ui/evidence.mjs --initialize

      - name: Install dependencies
        run: npm ci

      - name: Setup check
        run: npm run check:setup:ci

      - name: Operating mode
        env:
          JETNITY_OPERATING_MODE_EVENT: ${{ github.event_name }}
          JETNITY_OPERATING_MODE_REF: ${{ github.head_ref || github.ref_name }}
          JETNITY_OPERATING_MODE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          JETNITY_OPERATING_MODE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run check:operating-mode

      - name: Visitor, polling and isolated CI contract tests
        run: node --import ./scripts/server-only-test-register.mjs --import tsx --test lib/readiness/official-truth-product-v3/visitor/*.test.ts scripts/official-truth-product-v3-ui/*.test.mjs

      - name: Isolated harness typecheck
        run: node node_modules/typescript/bin/tsc --noEmit --incremental false --pretty false -p scripts/official-truth-product-v3-ui/tsconfig.json

      - name: Synthetic HTTP composition
        run: node --import ./scripts/server-only-test-register.mjs --import tsx scripts/official-truth-product-v3-ui/run.mjs --smoke

      - name: Local process benchmark
        run: node --import ./scripts/server-only-test-register.mjs --import tsx scripts/official-truth-product-v3-ui/benchmark.ts

      - name: Actual isolated browser audit
        run: node --import ./scripts/server-only-test-register.mjs --import tsx scripts/official-truth-product-v3-ui/run.mjs

      - name: Preserve actual synthetic evidence, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: official-truth-v3-ui-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: test-results/official-truth-product-v3-ui/
          if-no-files-found: error
          retention-days: 14

  required_verify:
    name: Typecheck, Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [verify, persisted_native, refresh_native, accepted_store_native, official_truth_v3_ui]
    if: ${{ always() }}

    steps:
      - name: Require all five verification job families to succeed
        env:
          CORE_RESULT: ${{ needs.verify.result }}
          PERSISTED_NATIVE_RESULT: ${{ needs.persisted_native.result }}
          REFRESH_NATIVE_RESULT: ${{ needs.refresh_native.result }}
          ACCEPTED_STORE_NATIVE_RESULT: ${{ needs.accepted_store_native.result }}
          OFFICIAL_TRUTH_V3_UI_RESULT: ${{ needs.official_truth_v3_ui.result }}
        run: |
          printf 'Core result: %.32s\nPersisted native result: %.32s\nRefresh native result: %.32s\nAccepted store native result: %.32s\nOfficial truth V3 UI result: %.32s\n' "$CORE_RESULT" "$PERSISTED_NATIVE_RESULT" "$REFRESH_NATIVE_RESULT" "$ACCEPTED_STORE_NATIVE_RESULT" "$OFFICIAL_TRUTH_V3_UI_RESULT"
          if [ "$CORE_RESULT" != "success" ] || [ "$PERSISTED_NATIVE_RESULT" != "success" ] || [ "$REFRESH_NATIVE_RESULT" != "success" ] || [ "$ACCEPTED_STORE_NATIVE_RESULT" != "success" ] || [ "$OFFICIAL_TRUTH_V3_UI_RESULT" != "success" ]; then
            printf '%s\n' 'All five verification job families must succeed.'
            exit 1
          fi
          printf '%s\n' 'All five verification job families succeeded.'

  # Die Auth-Konfiguration liegt nicht in der Datenbank, sondern beim
  # Auth-Server des Branches. Sie kann sich also ohne Commit ändern – ein Klick
  # im Dashboard genügt. Deshalb wird sie gegen supabase/config.toml geprüft
  # (Phase 1.4c, DECISIONS.md ADR-0039).
  #
  # Eigener Job, weil er ein Geheimnis braucht. Er ist fail-closed: Fehlen die
  # beiden Werte in den Repository-Secrets, bricht er ab. Eine Prüfung, die
  # nicht gelaufen ist, darf nicht grün aussehen – und ein grüner Job, in dem
  # der eigentliche Schritt übersprungen wurde, sieht genau so aus.
  #
  # Die einzige Ausnahme ist ein Pull Request aus einem Fork: GitHub gibt ihm
  # keine Secrets, das Fehlen ist dort also keine Nachlässigkeit, sondern die
  # Regel. Dieser Fall überspringt sich und sagt es.
  auth-konfiguration:
    name: Auth-Konfiguration gegen config.toml
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Zugang vorhanden?
        id: zugang
        env:
          # Bei einem `push` ist der Ausdruck `false`, weil die erste
          # Bedingung schon nicht zutrifft.
          AUS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "vorhanden=ja" >> "$GITHUB_OUTPUT"
          elif [ "$AUS_FORK" = "true" ]; then
            echo "vorhanden=nein" >> "$GITHUB_OUTPUT"
            echo "::notice::Übersprungen: Ein Pull Request aus einem Fork bekommt von GitHub keine Secrets."
          else
            echo "::error::SUPABASE_ACCESS_TOKEN und SUPABASE_PROJECT_REF fehlen in den Repository-Secrets. Der Abgleich der Auth-Konfiguration kann nicht laufen – und darf deshalb nicht grün aussehen."
            exit 1
          fi

      # Das Skript bricht selbst ab, wenn der Ref auf ein eigenständiges
      # Projekt zeigt statt auf einen Branch. Es liest und schreibt nichts an
      # der Datenbank und ändert keine Konfiguration.
      - name: Abgleich
        if: steps.zugang.outputs.vorhanden == 'ja'
        run: npm run auth:pruefen
