name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # fetch-depth: 0 is required so the operating-mode guard can compute the
      # exact PR-vs-base file list locally. GitHub's default shallow clone does
      # not contain the base SHA, and the guard must not use network APIs,
      # secrets, providers or paid services.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      # Bricht ab, wenn package-lock.json nicht zu package.json passt.
      - name: Install dependencies
        run: npm ci

      - name: Setup check
        run: npm run check:setup:ci

      - name: Operating mode
        env:
          JETNITY_OPERATING_MODE_EVENT: ${{ github.event_name }}
          JETNITY_OPERATING_MODE_REF: ${{ github.head_ref || github.ref_name }}
          JETNITY_OPERATING_MODE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          JETNITY_OPERATING_MODE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run check:operating-mode

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test:core

      # Der Bereichsschutz für Seiten liegt im Layout der Gruppe `(admin)` und
      # gilt dort automatisch. API-Routen haben kein Layout und müssen selbst
      # prüfen – diese Kontrolle stellt sicher, dass keine ungeschützt bleibt.
      - name: Schutz der Admin-API
        run: npm run check:api-schutz

      # Findet Zugriffe auf Tabellen und RPCs, die es im Schema nicht gibt.
      # Liest nur types/supabase.ts und braucht deshalb keinen Datenbankzugang.
      - name: Bezug auf das Schema
        run: npm run check:schema-bezug

      # Halten den Baum frei von Code und Paketen, die niemand mehr erreicht.
      # Bewusste Ausnahmen sind in den Skripten mit Grund hinterlegt.
      - name: Unerreichbarer Code
        run: npm run check:dead

      - name: Exporte ohne Aufrufer
        run: npm run check:exports

      - name: Ungenutzte Pakete
        run: npm run check:deps

      - name: Production build
        run: npm run build

  hosted_v3_native_pg17:
    name: Hosted V3 — native PostgreSQL 17
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # fetch-depth: 0 is required so the operating-mode guard can compute the
      # exact PR-vs-base file list locally. GitHub's default shallow clone does
      # not contain the base SHA, and the guard must not use network APIs,
      # secrets, providers or paid services.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      # Bricht ab, wenn package-lock.json nicht zu package.json passt.
      - name: Install dependencies
        run: npm ci

      - name: Setup check
        run: npm run check:setup:ci

      - name: Operating mode
        env:
          JETNITY_OPERATING_MODE_EVENT: ${{ github.event_name }}
          JETNITY_OPERATING_MODE_REF: ${{ github.head_ref || github.ref_name }}
          JETNITY_OPERATING_MODE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          JETNITY_OPERATING_MODE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run check:operating-mode

      # Hosted V3 proofs require actual PostgreSQL17 in this isolated job.
      # Core retains its mandatory PG16 proofs and the unchanged selector.
      - name: Provision mandatory PostgreSQL 17 from signed official packages
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          test "$VERSION_CODENAME" = noble
          test "$(dpkg --print-architecture)" = amd64
          command -v curl >/dev/null
          command -v gpg >/dev/null
          test -f /usr/share/keyrings/ubuntu-archive-keyring.gpg
          hma_tmp="$(mktemp -d /tmp/jetnity-hma1-pgdg.XXXXXX)"
          chmod 755 "$hma_tmp"
          hma_policy_changed=0
          hma_cluster_config_changed=0
          hma_policy_present=0
          hma_cluster_config_present=0
          hma_cleanup() {
            hma_status=$?
            trap - EXIT
            set +e
            if [ "$hma_policy_changed" = 1 ]; then
              if [ "$hma_policy_present" = 1 ]; then
                sudo cp -a "$hma_tmp/policy-rc.d.original" /usr/sbin/policy-rc.d || hma_status=1
              else
                sudo rm -f /usr/sbin/policy-rc.d || hma_status=1
              fi
            fi
            if [ "$hma_cluster_config_changed" = 1 ]; then
              if [ "$hma_cluster_config_present" = 1 ]; then
                sudo cp -a "$hma_tmp/createcluster.conf.original" /etc/postgresql-common/createcluster.conf || hma_status=1
              else
                sudo rm -f /etc/postgresql-common/createcluster.conf || hma_status=1
              fi
            fi
            sudo rm -rf -- "$hma_tmp" || hma_status=1
            exit "$hma_status"
          }
          trap hma_cleanup EXIT
          hma_no_system_cluster() {
            for hma_root in /etc/postgresql/17 /var/lib/postgresql/17; do
              test ! -L "$hma_root"
              if [ -e "$hma_root" ]; then
                test -d "$hma_root"
                test -z "$(sudo find "$hma_root" -mindepth 1 -maxdepth 1 -print -quit)"
              fi
            done
          }
          hma_no_system_cluster
          test ! -L /usr/sbin/policy-rc.d
          test ! -L /etc/postgresql-common/createcluster.conf
          if [ -e /usr/sbin/policy-rc.d ]; then
            test -f /usr/sbin/policy-rc.d
            sudo cp -a /usr/sbin/policy-rc.d "$hma_tmp/policy-rc.d.original"
            hma_policy_present=1
          fi
          if [ -e /etc/postgresql-common/createcluster.conf ]; then
            test -f /etc/postgresql-common/createcluster.conf
            sudo cp -a /etc/postgresql-common/createcluster.conf "$hma_tmp/createcluster.conf.original"
            hma_cluster_config_present=1
          fi
          printf '#!/bin/sh\nexit 101\n' > "$hma_tmp/policy-rc.d"
          printf 'create_main_cluster = false\n' > "$hma_tmp/createcluster.conf"
          hma_policy_changed=1
          sudo install -m 755 "$hma_tmp/policy-rc.d" /usr/sbin/policy-rc.d
          sudo install -d -m 755 /etc/postgresql-common
          hma_cluster_config_changed=1
          sudo install -m 644 "$hma_tmp/createcluster.conf" /etc/postgresql-common/createcluster.conf

          # Isolated APT sources avoid duplicating or rewriting an image's PGDG
          # configuration. Only official Ubuntu dependency and HTTPS PGDG indices.
          mkdir -m 700 "$hma_tmp/gnupg"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --connect-timeout 10 --max-time 60 \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc --output "$hma_tmp/pgdg.asc"
          gpg --batch --no-options --homedir "$hma_tmp/gnupg" --with-colons --show-keys "$hma_tmp/pgdg.asc" > "$hma_tmp/key-info"
          hma_fingerprint="$(awk -F: '$1=="pub"{pub++} $1=="fpr" && primary==""{primary=$10} END{if(pub!=1)exit 1;print primary}' "$hma_tmp/key-info")"
          test "$hma_fingerprint" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          chmod 644 "$hma_tmp/pgdg.asc"
          cat > "$hma_tmp/sources.list" <<HMA_SOURCES
          deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main universe
          deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-updates main universe
          deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu noble-security main universe
          deb [arch=amd64 signed-by=$hma_tmp/pgdg.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main
          HMA_SOURCES
          sudo install -d -m 755 "$hma_tmp/lists" "$hma_tmp/archives"
          sudo install -d -o _apt -m 700 "$hma_tmp/lists/partial" "$hma_tmp/archives/partial"
          hma_apt_options=(
            -o "Dir::Etc::sourcelist=$hma_tmp/sources.list"
            -o "Dir::Etc::sourceparts=-"
            -o "Dir::State::lists=$hma_tmp/lists"
            -o "Dir::Cache::archives=$hma_tmp/archives"
            -o "Acquire::AllowInsecureRepositories=false"
            -o "Acquire::AllowDowngradeToInsecureRepositories=false"
            -o "APT::Get::AllowUnauthenticated=false"
            -o "APT::Update::Error-Mode=any"
            -o "Acquire::https::Verify-Peer=true"
            -o "Acquire::https::Verify-Host=true"
            -o "Acquire::https::Timeout=30"
            -o "Acquire::Retries=0"
          )
          sudo apt-get "${hma_apt_options[@]}" update
          hma_pgdg_version() {
            apt-cache "${hma_apt_options[@]}" madison "$1" |
              awk -F'|' -v wanted="$1" '{
                name=$1;version=$2;origin=$3
                gsub(/^[ \t]+|[ \t]+$/,"",name)
                gsub(/^[ \t]+|[ \t]+$/,"",version)
                gsub(/^[ \t]+|[ \t]+$/,"",origin)
                if(name==wanted && origin=="https://apt.postgresql.org/pub/repos/apt noble-pgdg/main amd64 Packages" && selected=="")selected=version
              } END{if(selected=="")exit 1;print selected}'
          }
          hma_server_version="$(hma_pgdg_version postgresql-17)"
          hma_client_version="$(hma_pgdg_version postgresql-client-17)"
          [[ "$hma_server_version" =~ ^17\.[0-9]+-[0-9]+\.pgdg24\.04\+[0-9]+$ ]]
          test "$hma_server_version" = "$hma_client_version"
          printf 'HMA1 PGDG key: %s\nHMA1 package origin: https://apt.postgresql.org/pub/repos/apt noble-pgdg/main amd64\n' "$hma_fingerprint"
          printf 'HMA1 selected packages: postgresql-17=%s postgresql-client-17=%s\n' "$hma_server_version" "$hma_client_version"
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get "${hma_apt_options[@]}" --assume-yes --no-install-recommends --reinstall install \
            "postgresql-17=$hma_server_version" "postgresql-client-17=$hma_client_version"
          hma_no_system_cluster
          apt-cache "${hma_apt_options[@]}" policy postgresql-17 postgresql-client-17

          # Invoke the existing selector without changing it, PATH or a sibling
          # toolchain. These commands report versions; no database is started.
          HMA1_EXPECTED_PACKAGE_VERSION="$hma_server_version" node --import tsx --input-type=module <<'HMA_NODE'
          import assert from 'node:assert/strict'
          import { execFileSync } from 'node:child_process'
          import { realpathSync } from 'node:fs'
          import localProofClusterModule from './scripts/db/official-truth-integrated-pilot-1/local-cluster.ts'
          const { findLocalPgBins } = localProofClusterModule
          assert.equal(typeof findLocalPgBins, 'function', 'local proof selector export missing')
          const run = (file, args) => execFileSync(file, args, { encoding: 'utf8', stdio: 'pipe', timeout: 10_000, maxBuffer: 16_384 }).trim()
          const expectedVersion = process.env.HMA1_EXPECTED_PACKAGE_VERSION
          assert.match(expectedVersion ?? '', /^17\.[0-9]+-[0-9]+\.pgdg24\.04\+[0-9]+$/)
          const packages = ['postgresql-17', 'postgresql-client-17'].map(name => {
            const fields = run('dpkg-query', ['-W', '-f=${binary:Package}\t${Version}\t${Architecture}\t${db:Status-Status}', name]).split('\t')
            assert.ok(fields[0] === name || fields[0] === name + ':amd64')
            assert.deepEqual(fields.slice(1), [expectedVersion, 'amd64', 'installed'])
            assert.equal(run('dpkg', ['--verify', name]), '', 'installed package content differs')
            return { name, version: fields[1], architecture: fields[2], origin: 'https://apt.postgresql.org/pub/repos/apt noble-pgdg/main' }
          })
          const bins = findLocalPgBins()
          assert.ok(bins, 'mandatory PostgreSQL17 binaries missing')
          const programs = ['initdb', 'pg_ctl', 'postgres', 'psql'].map(name => {
            const expected = '/usr/lib/postgresql/17/bin/' + name
            assert.equal(bins[name], expected, 'unchanged selector chose another root')
            assert.equal(realpathSync(bins[name]), expected, 'selected binary resolves outside the official path')
            const owner = run('dpkg-query', ['-S', expected])
            const expectedPackage = name === 'psql' ? 'postgresql-client-17' : 'postgresql-17'
            assert.ok(owner === expectedPackage + ': ' + expected || owner === expectedPackage + ':amd64: ' + expected)
            const version = run(expected, ['--version'])
            assert.ok(version.length <= 256)
            assert.match(version, new RegExp('^' + name + ' \\(PostgreSQL\\) 17\\.[0-9]+(?:\\s|$)'))
            return { name, path: bins[name], resolved: realpathSync(bins[name]), package: expectedPackage, version }
          })
          const receipt = { schema: 'jetnity.hma1.ci-postgres17.v1', keyFingerprint: 'B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8', packages, programs, databaseStarted: false }
          assert.ok(Buffer.byteLength(JSON.stringify(receipt)) < 4096)
          console.log('HMA1_POSTGRES17_PROVISION_RECEIPT ' + JSON.stringify(receipt))
          HMA_NODE

      - name: Hosted V3 native proofs
        run: npm run test:hosted-v3-native

  persisted_native:
    name: Persisted canonical read — native
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      # fetch-depth: 0 is required so the operating-mode guard can compute the
      # exact PR-vs-base file list locally. GitHub's default shallow clone does
      # not contain the base SHA, and the guard must not use network APIs,
      # secrets, providers or paid services.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      # Bricht ab, wenn package-lock.json nicht zu package.json passt.
      - name: Install dependencies
        run: npm ci

      - name: Setup check
        run: npm run check:setup:ci

      - name: Operating mode
        env:
          JETNITY_OPERATING_MODE_EVENT: ${{ github.event_name }}
          JETNITY_OPERATING_MODE_REF: ${{ github.head_ref || github.ref_name }}
          JETNITY_OPERATING_MODE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          JETNITY_OPERATING_MODE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run check:operating-mode

      - name: Persisted native proof
        run: npm run test:persisted-native

  refresh_native:
    name: Atomic version refresh — native
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      # Same exact-ref guard and isolated standard runner as the existing proof.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup check
        run: npm run check:setup:ci

      - name: Operating mode
        env:
          JETNITY_OPERATING_MODE_EVENT: ${{ github.event_name }}
          JETNITY_OPERATING_MODE_REF: ${{ github.head_ref || github.ref_name }}
          JETNITY_OPERATING_MODE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          JETNITY_OPERATING_MODE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run check:operating-mode

      - name: Atomic refresh native proof
        run: npm run test:refresh-native

  accepted_store_native:
    name: Accepted store trip integration — native (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [store, lifecycle]

    steps:
      # Same exact-ref guard and isolated standard runner as the existing proof.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup check
        run: npm run check:setup:ci

      - name: Operating mode
        env:
          JETNITY_OPERATING_MODE_EVENT: ${{ github.event_name }}
          JETNITY_OPERATING_MODE_REF: ${{ github.head_ref || github.ref_name }}
          JETNITY_OPERATING_MODE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          JETNITY_OPERATING_MODE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run check:operating-mode

      - name: Accepted store native proof
        run: npm run test:accepted-store-native:${{ matrix.group }}

  official_truth_v3_ui:
    name: Official truth V3 — isolated UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      JETNITY_U1_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Bind synthetic evidence to this run and checkout
        run: node scripts/official-truth-product-v3-ui/evidence.mjs --initialize

      - name: Install dependencies
        run: npm ci

      - name: Setup check
        run: npm run check:setup:ci

      - name: Operating mode
        env:
          JETNITY_OPERATING_MODE_EVENT: ${{ github.event_name }}
          JETNITY_OPERATING_MODE_REF: ${{ github.head_ref || github.ref_name }}
          JETNITY_OPERATING_MODE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          JETNITY_OPERATING_MODE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run check:operating-mode

      - name: Visitor, polling and isolated CI contract tests
        run: node --experimental-test-module-mocks --import ./scripts/server-only-test-register.mjs --import tsx --test lib/readiness/official-truth-product-v3/visitor/*.test.ts scripts/official-truth-product-v3-ui/*.test.mjs

      - name: Isolated harness typecheck
        run: node node_modules/typescript/bin/tsc --noEmit --incremental false --pretty false -p scripts/official-truth-product-v3-ui/tsconfig.json

      - name: Synthetic HTTP composition
        run: node --import ./scripts/server-only-test-register.mjs --import tsx scripts/official-truth-product-v3-ui/run.mjs --smoke

      - name: Local process benchmark
        run: node --import ./scripts/server-only-test-register.mjs --import tsx scripts/official-truth-product-v3-ui/benchmark.ts

      - name: Actual isolated browser audit
        run: node --import ./scripts/server-only-test-register.mjs --import tsx scripts/official-truth-product-v3-ui/run.mjs

      - name: Preserve actual synthetic evidence, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: official-truth-v3-ui-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: test-results/official-truth-product-v3-ui/
          if-no-files-found: error
          retention-days: 14

  required_verify:
    name: Typecheck, Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [verify, persisted_native, refresh_native, accepted_store_native, official_truth_v3_ui, hosted_v3_native_pg17]
    if: ${{ always() }}

    steps:
      - name: Require all six verification job families to succeed
        env:
          CORE_RESULT: ${{ needs.verify.result }}
          PERSISTED_NATIVE_RESULT: ${{ needs.persisted_native.result }}
          REFRESH_NATIVE_RESULT: ${{ needs.refresh_native.result }}
          ACCEPTED_STORE_NATIVE_RESULT: ${{ needs.accepted_store_native.result }}
          OFFICIAL_TRUTH_V3_UI_RESULT: ${{ needs.official_truth_v3_ui.result }}
          HOSTED_V3_NATIVE_PG17_RESULT: ${{ needs.hosted_v3_native_pg17.result }}
        run: |
          printf 'Core result: %.32s\nPersisted native result: %.32s\nRefresh native result: %.32s\nAccepted store native result: %.32s\nOfficial truth V3 UI result: %.32s\nHosted V3 native PG17 result: %.32s\n' "$CORE_RESULT" "$PERSISTED_NATIVE_RESULT" "$REFRESH_NATIVE_RESULT" "$ACCEPTED_STORE_NATIVE_RESULT" "$OFFICIAL_TRUTH_V3_UI_RESULT" "$HOSTED_V3_NATIVE_PG17_RESULT"
          if [ "$CORE_RESULT" != "success" ] || [ "$PERSISTED_NATIVE_RESULT" != "success" ] || [ "$REFRESH_NATIVE_RESULT" != "success" ] || [ "$ACCEPTED_STORE_NATIVE_RESULT" != "success" ] || [ "$OFFICIAL_TRUTH_V3_UI_RESULT" != "success" ] || [ "$HOSTED_V3_NATIVE_PG17_RESULT" != "success" ]; then
            printf '%s\n' 'All six verification job families must succeed.'
            exit 1
          fi
          printf '%s\n' 'All six verification job families succeeded.'

  # Die Auth-Konfiguration liegt nicht in der Datenbank, sondern beim
  # Auth-Server des Branches. Sie kann sich also ohne Commit ändern – ein Klick
  # im Dashboard genügt. Deshalb wird sie gegen supabase/config.toml geprüft
  # (Phase 1.4c, DECISIONS.md ADR-0039).
  #
  # Eigener Job, weil er ein Geheimnis braucht. Er ist fail-closed: Fehlen die
  # beiden Werte in den Repository-Secrets, bricht er ab. Eine Prüfung, die
  # nicht gelaufen ist, darf nicht grün aussehen – und ein grüner Job, in dem
  # der eigentliche Schritt übersprungen wurde, sieht genau so aus.
  #
  # Die einzige Ausnahme ist ein Pull Request aus einem Fork: GitHub gibt ihm
  # keine Secrets, das Fehlen ist dort also keine Nachlässigkeit, sondern die
  # Regel. Dieser Fall überspringt sich und sagt es.
  auth-konfiguration:
    name: Auth-Konfiguration gegen config.toml
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Zugang vorhanden?
        id: zugang
        env:
          # Bei einem `push` ist der Ausdruck `false`, weil die erste
          # Bedingung schon nicht zutrifft.
          AUS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "vorhanden=ja" >> "$GITHUB_OUTPUT"
          elif [ "$AUS_FORK" = "true" ]; then
            echo "vorhanden=nein" >> "$GITHUB_OUTPUT"
            echo "::notice::Übersprungen: Ein Pull Request aus einem Fork bekommt von GitHub keine Secrets."
          else
            echo "::error::SUPABASE_ACCESS_TOKEN und SUPABASE_PROJECT_REF fehlen in den Repository-Secrets. Der Abgleich der Auth-Konfiguration kann nicht laufen – und darf deshalb nicht grün aussehen."
            exit 1
          fi

      # Das Skript bricht selbst ab, wenn der Ref auf ein eigenständiges
      # Projekt zeigt statt auf einen Branch. Es liest und schreibt nichts an
      # der Datenbank und ändert keine Konfiguration.
      - name: Abgleich
        if: steps.zugang.outputs.vorhanden == 'ja'
        run: npm run auth:pruefen
