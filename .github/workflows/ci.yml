name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      # Bricht ab, wenn package-lock.json nicht zu package.json passt.
      - name: Install dependencies
        run: npm ci

      - name: Setup check
        run: npm run check:setup:ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Halten den Baum frei von Code und Paketen, die niemand mehr erreicht.
      # Bewusste Ausnahmen sind in den Skripten mit Grund hinterlegt.
      - name: Unerreichbarer Code
        run: npm run check:dead

      - name: Ungenutzte Pakete
        run: npm run check:deps

      - name: Production build
        run: npm run build
