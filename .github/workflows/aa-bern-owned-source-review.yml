name: AA Bern ordinary owned-source review
on:
  push:
    branches: [review/aa-bern-owned-read-20261112]
permissions:
  contents: read
concurrency:
  group: aa-bern-owned-source-review-20261112
  cancel-in-progress: false
jobs:
  review:
    if: github.run_attempt == 1 && github.event.before == '63544e820e912bd275556588c956a09b99b1cf90'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install exact existing dependencies
        run: npm ci --ignore-scripts
      - name: One ordinary bounded AA and Bern read
        run: node --import ./scripts/server-only-test-register.mjs --import tsx scripts/aa-bern-owned-source-review/run.ts
      - name: Preserve encrypted review material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aa-bern-owned-review
          path: aa-bern-review-output/
          retention-days: 1
          if-no-files-found: warn
