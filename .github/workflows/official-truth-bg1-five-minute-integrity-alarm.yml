name: BG1 Production integrity alarm (5-minute, legacy anon)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# GitHub notification is a comment in the existing PR #1254, not a new issue.
# The workflow is scheduled only after a normal, Owner-approved main merge.
# Existing public anon JWT only; no service-role key, user session or database write.
permissions:
  contents: read
  issues: write
  # GitHub's PR timeline API currently also requires this for Actions tokens,
  # despite REST docs presenting Issues:write as an alternative.
  # See GitHub rest-api-description #6994; no new tokens or paid services.
  pull-requests: write

concurrency:
  group: jetnity-bg1-production-integrity-alarm-v2
  cancel-in-progress: false

jobs:
  alert:
    if: >-
      github.repository == 'Jetnity/jetnity' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.private == false &&
      vars.JETNITY_BG1_FIVE_MIN_ALARM == 'production:qscbgcdmivbbnzrcyegn:integrity-only-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Read only fixed public BG1 integrity status, deduplicate and notify
        env:
          JETNITY_BG1_FIVE_MIN_ALARM: ${{ vars.JETNITY_BG1_FIVE_MIN_ALARM }}
          SUPABASE_PROJECT_REF: qscbgcdmivbbnzrcyegn
          JETNITY_BG1_PROD_ANON_KEY: ${{ secrets.JETNITY_BG1_PROD_ANON_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/official-truth-bg1-five-minute-integrity-alarm.mjs
