name: TEMP Assistant Runtime 1 Development Smoke

on:
  push:
    branches:
      - tmp/assistant-runtime-1-smoke-20260917

permissions:
  contents: read

jobs:
  smoke:
    name: One bounded real Preview/development Assistant call
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      NEXT_PUBLIC_SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
      PREVIEW_URL: https://jetnity-app-git-feat-phase-1-assistant-82e2ae-jetnity-e1b93c82.vercel.app
      LOCKED_HEAD: 8915ef45849b6544fe6fea201fb1450392c15f83

    steps:
      - name: Checkout locked PR head
        uses: actions/checkout@v4
        with:
          ref: 8915ef45849b6544fe6fea201fb1450392c15f83

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required repository secrets exist
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Required Development Supabase repository secrets are missing."
            exit 1
          fi

      - name: Generate one-time smoke credentials
        shell: bash
        run: |
          EMAIL="jetnity.assistant.smoke.$(date -u +%Y%m%d%H%M%S)@example.com"
          PASS="$(node -e "console.log(require('crypto').randomBytes(24).toString('base64url'))")"
          echo "::add-mask::$PASS"
          echo "SMOKE_EMAIL=$EMAIL" >> "$GITHUB_ENV"
          echo "SMOKE_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Create temporary Development account through Auth Admin path
        shell: bash
        run: |
          npm run auth:testkonto -- anlegen "$SMOKE_EMAIL" "$SMOKE_PASSWORD" user
          echo "SMOKE_CREATED=1" >> "$GITHUB_ENV"

      - name: Create minimal Development trip and baseline usage evidence
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const token = process.env.SUPABASE_ACCESS_TOKEN
          const ref = process.env.SUPABASE_PROJECT_REF
          const email = process.env.SMOKE_EMAIL
          if (!token || !ref || !email) throw new Error('Smoke environment incomplete')

          const api = `https://api.supabase.com/v1/projects/${ref}/database/query`
          async function sql(query) {
            const res = await fetch(api, {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ query }),
            })
            const text = await res.text()
            if (!res.ok) throw new Error(`Management SQL failed HTTP ${res.status}`)
            return text ? JSON.parse(text) : []
          }
          const lit = (v) => `'${String(v).replaceAll("'", "''")}'`

          ;(async () => {
            const users = await sql(`select id from auth.users where email = ${lit(email)} limit 1`)
            if (users.length !== 1) throw new Error(`Expected exactly one temporary auth user, got ${users.length}`)
            const userId = users[0].id

            const baseline = await sql("select count(*)::int as n from public.model_usage where funktion = 'reisebegleiter'")
            const baselineCount = Number(baseline[0]?.n ?? -1)
            if (baselineCount < 0) throw new Error('Could not establish model_usage baseline')

            const trips = await sql(`
              insert into public.trips
                (user_id, client_ref, title, origin, start_date, end_date, travellers, currency, status, pace, interests, travel_wish, day_stage_assignment_mode)
              values
                (${lit(userId)}, 'assistant-smoke-trip', 'Assistant Smoke', 'Zürich', '2026-11-05', '2026-11-07', 1, 'CHF', 'draft', 'balanced', ARRAY['culture']::text[], 'Kurze Städtereise mit klarer Etappe.', 'single_destination')
              returning id
            `)
            if (trips.length !== 1) throw new Error('Temporary trip was not created')
            const tripId = trips[0].id

            const stages = await sql(`
              insert into public.trip_stages
                (trip_id, user_id, position, name, country_code, arrival_date, departure_date)
              values
                (${lit(tripId)}, ${lit(userId)}, 1, 'Lissabon', 'PT', '2026-11-05', '2026-11-07')
              returning id
            `)
            if (stages.length !== 1) throw new Error('Temporary stage was not created')
            const stageId = stages[0].id

            await sql(`
              insert into public.trip_days
                (trip_id, user_id, day_index, day_date, title, stage_id)
              values
                (${lit(tripId)}, ${lit(userId)}, 1, '2026-11-05', 'Ankunft', ${lit(stageId)})
            `)

            fs.appendFileSync(process.env.GITHUB_ENV, `TRIP_ID=${tripId}\nSTAGE_ID=${stageId}\nBASELINE_USAGE=${baselineCount}\n`)
            console.log(`Temporary Development trip ready; reisebegleiter baseline=${baselineCount}`)
          })().catch((err) => { console.error(err.message); process.exit(1) })
          NODE

      - name: Install Chromium for one real browser smoke
        run: npx playwright install --with-deps chromium

      - name: Execute exactly one real Assistant call on locked Preview
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright')
          const token = process.env.SUPABASE_ACCESS_TOKEN
          const ref = process.env.SUPABASE_PROJECT_REF
          const email = process.env.SMOKE_EMAIL
          const password = process.env.SMOKE_PASSWORD
          const tripId = process.env.TRIP_ID
          const preview = process.env.PREVIEW_URL
          const baseline = Number(process.env.BASELINE_USAGE)
          if (!token || !ref || !email || !password || !tripId || !preview || !Number.isFinite(baseline)) {
            throw new Error('Smoke environment incomplete before browser call')
          }

          const api = `https://api.supabase.com/v1/projects/${ref}/database/query`
          async function sql(query) {
            const res = await fetch(api, {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ query }),
            })
            const text = await res.text()
            if (!res.ok) throw new Error(`Management SQL failed HTTP ${res.status}`)
            return text ? JSON.parse(text) : []
          }
          const usageCount = async () => {
            const rows = await sql("select count(*)::int as n from public.model_usage where funktion = 'reisebegleiter'")
            return Number(rows[0]?.n ?? -1)
          }

          ;(async () => {
            const browser = await chromium.launch({ headless: true })
            const page = await browser.newPage({ viewport: { width: 1280, height: 900 } })
            const pageErrors = []
            page.on('pageerror', (e) => pageErrors.push(String(e.message || e)))

            try {
              await page.goto(`${preview}/login?next=${encodeURIComponent(`/reisen/${tripId}`)}`, { waitUntil: 'domcontentloaded', timeout: 45000 })
              await page.locator('#email').fill(email)
              await page.locator('#password').fill(password)
              await page.getByRole('button', { name: 'Anmelden' }).click()
              await page.waitForURL((url) => url.pathname === `/reisen/${tripId}`, { timeout: 45000 })

              const openButton = page.getByRole('button', { name: 'Reisebegleiter fragen' })
              await openButton.waitFor({ state: 'visible', timeout: 30000 })

              const beforeMount = await usageCount()
              if (beforeMount !== baseline) {
                throw new Error(`Unexpected paid Assistant usage before opening surface: baseline=${baseline}, current=${beforeMount}`)
              }

              await openButton.click()
              await page.locator('#reisebegleiter-frage').waitFor({ state: 'visible', timeout: 10000 })

              const beforeSubmit = await usageCount()
              if (beforeSubmit !== baseline) {
                throw new Error(`Assistant mounted with an unexpected model call: baseline=${baseline}, current=${beforeSubmit}`)
              }

              await page.locator('#reisebegleiter-frage').fill('Was ist bei dieser Reise noch offen?')
              await page.getByRole('button', { name: 'Frage stellen' }).click()

              const success = page.getByRole('heading', { name: 'Auskunft des Reisebegleiters' })
              const error = page.locator('#reisebegleiter [role="alert"]')
              const outcome = await Promise.race([
                success.waitFor({ state: 'visible', timeout: 90000 }).then(() => 'success'),
                error.waitFor({ state: 'visible', timeout: 90000 }).then(() => 'error'),
              ])
              if (outcome === 'error') {
                const text = (await error.textContent())?.trim() || 'unknown Assistant UI error'
                throw new Error(`Assistant UI returned an error after the single call: ${text}`)
              }

              const after = await usageCount()
              if (after !== baseline + 1) {
                throw new Error(`Expected exactly one paid Assistant usage row; baseline=${baseline}, after=${after}`)
              }

              const rows = await sql(`
                select funktion, modell, art, ergebnis, eingabe_tokens, gecachte_tokens, ausgabe_tokens,
                       laufzeit_ms, kosten_mikro_usd, created_at, abgeschlossen_am
                  from public.model_usage
                 where funktion = 'reisebegleiter'
                 order by created_at desc
                 limit 1
              `)
              const row = rows[0]
              if (!row) throw new Error('No reisebegleiter usage row found after successful UI result')
              if (row.ergebnis !== 'erfolg') throw new Error(`Latest reisebegleiter result is ${row.ergebnis}, expected erfolg`)
              if (!row.abgeschlossen_am) throw new Error('Latest reisebegleiter usage row is not completed')
              if (!(Number(row.eingabe_tokens) > 0) || !(Number(row.ausgabe_tokens) > 0)) {
                throw new Error('Completed paid call is missing positive input/output token accounting')
              }
              if (!(Number(row.kosten_mikro_usd) >= 0)) throw new Error('Completed paid call has invalid cost accounting')
              if (pageErrors.length) throw new Error(`Browser page errors observed: ${pageErrors.join(' | ')}`)

              console.log(JSON.stringify({
                smoke: 'PASS',
                lockedHead: process.env.LOCKED_HEAD,
                deployment: 'dpl_8BvCeC9XoUbgHQtW4bYsJU34B9md',
                function: row.funktion,
                model: row.modell,
                kind: row.art,
                result: row.ergebnis,
                inputTokens: Number(row.eingabe_tokens),
                cachedTokens: row.gecachte_tokens == null ? null : Number(row.gecachte_tokens),
                outputTokens: Number(row.ausgabe_tokens),
                runtimeMs: row.laufzeit_ms == null ? null : Number(row.laufzeit_ms),
                costMicroUsd: Number(row.kosten_mikro_usd),
                completed: Boolean(row.abgeschlossen_am),
                callsCreated: after - baseline,
              }))
            } finally {
              await browser.close()
            }
          })().catch((err) => { console.error(err.message); process.exit(1) })
          NODE

      - name: Cleanup temporary Development trip and account
        if: always()
        shell: bash
        run: |
          if [ "${SMOKE_CREATED:-}" != "1" ]; then
            echo "No temporary account was created; nothing to clean."
            exit 0
          fi

          node <<'NODE'
          const token = process.env.SUPABASE_ACCESS_TOKEN
          const ref = process.env.SUPABASE_PROJECT_REF
          const email = process.env.SMOKE_EMAIL
          const tripId = process.env.TRIP_ID
          if (!token || !ref || !email) process.exit(0)
          const api = `https://api.supabase.com/v1/projects/${ref}/database/query`
          async function sql(query) {
            const res = await fetch(api, {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ query }),
            })
            if (!res.ok) throw new Error(`Cleanup SQL failed HTTP ${res.status}`)
            const text = await res.text()
            return text ? JSON.parse(text) : []
          }
          const lit = (v) => `'${String(v).replaceAll("'", "''")}'`
          ;(async () => {
            if (tripId) {
              await sql(`delete from public.trip_days where trip_id = ${lit(tripId)}`)
              await sql(`delete from public.trip_stages where trip_id = ${lit(tripId)}`)
              await sql(`delete from public.trips where id = ${lit(tripId)}`)
            }
          })().catch((err) => { console.error(err.message); process.exit(1) })
          NODE

          npm run auth:testkonto -- entfernen "$SMOKE_EMAIL"

          node <<'NODE'
          const token = process.env.SUPABASE_ACCESS_TOKEN
          const ref = process.env.SUPABASE_PROJECT_REF
          const email = process.env.SMOKE_EMAIL
          const api = `https://api.supabase.com/v1/projects/${ref}/database/query`
          const lit = (v) => `'${String(v).replaceAll("'", "''")}'`
          async function sql(query) {
            const res = await fetch(api, {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ query }),
            })
            const text = await res.text()
            if (!res.ok) throw new Error(`Cleanup verification failed HTTP ${res.status}`)
            return text ? JSON.parse(text) : []
          }
          ;(async () => {
            const rows = await sql(`
              select
                (select count(*)::int from auth.users where email = ${lit(email)}) as auth_users,
                (select count(*)::int from public.trips where client_ref = 'assistant-smoke-trip') as trips
            `)
            const r = rows[0]
            if (Number(r?.auth_users) !== 0 || Number(r?.trips) !== 0) {
              throw new Error(`Cleanup incomplete: auth_users=${r?.auth_users}, trips=${r?.trips}`)
            }
            console.log('Cleanup verified: temporary auth user=0, temporary trips=0')
          })().catch((err) => { console.error(err.message); process.exit(1) })
          NODE
