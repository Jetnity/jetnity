name: Decommission legacy jetnity-bets

on:
  push:
    branches:
      - ops/decommission-jetnity-bets-2026-08-30
    paths:
      - .github/workflows/decommission-jetnity-bets.yml

permissions:
  contents: read

jobs:
  delete-legacy-project:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete exact unused Supabase project
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          TARGET_REF='jrixsujkzvlvglvcmtia'
          TARGET_NAME='jetnity-bets'
          PRODUCTION_REF='qscbgcdmivbbnzrcyegn'
          EXPECTED_REPOSITORY='Jetnity/jetnity'
          EXPECTED_REF='refs/heads/ops/decommission-jetnity-bets-2026-08-30'

          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]]
          [[ "$GITHUB_REF" == "$EXPECTED_REF" ]]
          [[ "$TARGET_REF" != "$PRODUCTION_REF" ]]
          [[ -n "${SUPABASE_ACCESS_TOKEN:-}" ]]

          before_file="$(mktemp)"
          before_code="$(curl --silent --show-error --output "$before_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${TARGET_REF}")"

          [[ "$before_code" == '200' ]]
          jq -e \
            --arg target "$TARGET_REF" \
            --arg target_name "$TARGET_NAME" \
            '((.id == $target) or (.ref == $target)) and (.name == $target_name)' \
            "$before_file" >/dev/null

          delete_file="$(mktemp)"
          delete_code="$(curl --silent --show-error --output "$delete_file" --write-out '%{http_code}' \
            --request DELETE \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${TARGET_REF}")"

          case "$delete_code" in
            200|204) ;;
            *)
              echo "Delete failed with HTTP ${delete_code}." >&2
              exit 1
              ;;
          esac

          after_file="$(mktemp)"
          after_code="$(curl --silent --show-error --output "$after_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${TARGET_REF}")"

          [[ "$after_code" == '404' ]]
          echo "Confirmed deletion of exact legacy Supabase project ${TARGET_REF}; Production ref was not targeted."
