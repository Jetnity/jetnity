name: Passkey Production einmal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  passkey:
    name: Nur passkey_enabled am Production-Projekt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: qscbgcdmivbbnzrcyegn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Lesen und nur den Passkey-Schalter setzen
        run: node --import tsx scripts/auth/passkey-produktion.ts --produktion --projekt-ref qscbgcdmivbbnzrcyegn --setzen
