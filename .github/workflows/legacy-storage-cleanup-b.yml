name: Legacy Storage Cleanup B

on:
  push:
    branches:
      - cleanup/legacy-storage-batch-b-2026-08-30
    paths:
      - .github/workflows/legacy-storage-cleanup-b.yml

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    name: Approved Production Storage Cleanup
    runs-on: ubuntu-latest
    steps:
      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=jetnity-storage-cleanup-b-2026-08-30")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Invoke exact approved Storage API cleanup
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          response="$(curl -fsSL -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://qscbgcdmivbbnzrcyegn.supabase.co/functions/v1/legacy-storage-cleanup-b-02b3d173fa19b00cde06b258ad22cb62")"
          python - "$response" <<'PY'
          import json, sys
          payload = json.loads(sys.argv[1])
          if payload.get('ok') is not True:
              raise SystemExit('Storage cleanup executor returned non-PASS result')
          expected = {
              'masks', 'media-original', 'media-proxy', 'media-renders', 'media-thumbs',
              'media-versions', 'public-media', 'renders', 'session-versions', 'subtitles'
          }
          completed = set(payload.get('deleted', [])) | set(payload.get('skippedAlreadyMissing', []))
          if completed != expected:
              raise SystemExit('Storage cleanup result does not match exact approved set')
          if payload.get('remaining') != [] or payload.get('creatorMediaPresent') is not True:
              raise SystemExit('Storage cleanup after-image guard failed')
          print('Approved legacy Storage bucket cleanup completed for exact 10-bucket scope.')
          PY
