name: Legacy Storage Cleanup B Teardown

on:
  push:
    branches:
      - cleanup/legacy-storage-batch-b-2026-08-30
    paths:
      - .github/workflows/legacy-storage-cleanup-b.yml

permissions:
  contents: read

jobs:
  teardown:
    name: Remove temporary Production cleanup executor
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Require existing Management API token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}"

      - name: Delete temporary Edge Function via Management API
        shell: bash
        run: |
          set -euo pipefail
          slug='legacy-storage-cleanup-b-02b3d173fa19b00cde06b258ad22cb62'
          base='https://api.supabase.com/v1/projects/qscbgcdmivbbnzrcyegn/functions'
          curl -fsSL -X DELETE \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "${base}/${slug}" >/dev/null
          listing="$(curl -fsSL \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "${base}")"
          python - "$listing" "$slug" <<'PY'
          import json, sys
          payload = json.loads(sys.argv[1])
          slug = sys.argv[2]
          if any(item.get('slug') == slug for item in payload):
              raise SystemExit('Temporary cleanup Edge Function still exists')
          print('Temporary cleanup Edge Function removed.')
          PY
