name: AA Bern reviewed program proof
on:
  push:
    branches: [review/aa-bern-reviewed-program-20261112]
permissions:
  contents: read
concurrency:
  group: aa-bern-reviewed-program-20261112
  cancel-in-progress: false
jobs:
  proof:
    if: github.run_attempt == 1 && github.event.before == '51dc67ad8ef7264d2ea1295ba56ae44f69038409'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install exact existing dependencies
        run: npm ci --ignore-scripts
      - name: Verify reviewed program against two actual owned originals
        run: node --import ./scripts/server-only-test-register.mjs --import tsx scripts/aa-bern-reviewed-program-proof/run.ts
