name: AA preflight diagnostic

# Temporary A13 diagnosis only; Root removes this workflow after the finding.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  aa_preflight_diagnostic:
    name: AA synthetic preflight only
    if: >-
      ${{ github.event_name == 'pull_request' &&
          github.repository == 'Jetnity/jetnity' &&
          github.event.pull_request.number == 1192 &&
          github.event.pull_request.head.repo.full_name == 'Jetnity/jetnity' &&
          github.event.pull_request.head.ref == 'feat/official-truth-aa-revision-probe-1-20261112' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm ci

      - name: Require exact Run0 source and run isolated preflight
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import { createHash } from 'node:crypto'

          const requireSource = (path, expectedBytes, expectedSha256) => {
            const bytes = readFileSync(path)
            if (bytes.byteLength !== expectedBytes ||
                createHash('sha256').update(bytes).digest('hex') !== expectedSha256) {
              throw new Error('AA diagnostic requires the exact reviewed source')
            }
            return bytes.toString('utf8')
          }
          const policy = requireSource(
            'lib/readiness/official-truth-aa-revision-probe-1-policy.ts',
            4574,
            'ae784339b019958ee7e496a90028a69b91634c0424a64285d613cacc09e817fd',
          )
          const runRows = policy.split('\n').filter(line => line.trimStart().startsWith('runNumber:'))
          if (runRows.length !== 1 || runRows[0] !== '  runNumber: 0 as number,') {
            throw new Error('AA diagnostic refuses an armed or ambiguous policy')
          }
          requireSource(
            'lib/readiness/official-truth-aa-revision-probe-1.test.ts',
            58259,
            'f3e9e2f8f98977403343dd9ef0aebb90e114ae1cc35ac1055e8ce50c9aaff853',
          )
          console.log('AA_DIAGNOSTIC_RUN0_PIN_CONFIRMED')
          NODE
          node --max-old-space-size=1024 --import ./scripts/server-only-test-register.mjs --import tsx --test --test-concurrency=1 lib/readiness/official-truth-aa-revision-probe-1.test.ts
