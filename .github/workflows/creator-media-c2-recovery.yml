name: creator-media C2 recovery proof

on:
  push:
    branches:
      - ops/creator-media-c2-recovery-2026-08-30
    paths:
      - .github/workflows/creator-media-c2-recovery.yml

permissions:
  contents: read
  id-token: write

jobs:
  recovery-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_REF: qscbgcdmivbbnzrcyegn
      FUNCTION_SLUG: creator-media-c2-recovery
      OIDC_AUDIENCE: jetnity-creator-media-c2-20260830
    steps:
      - name: Obtain GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          token_json="$(curl --fail --silent --show-error \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          oidc_token="$(jq -r '.value' <<<"$token_json")"
          [[ -n "$oidc_token" && "$oidc_token" != "null" ]]
          echo "token=$oidc_token" >> "$GITHUB_OUTPUT"

      - name: Execute private backup and restore proof
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header 'Content-Type: application/json' \
            "https://${PROJECT_REF}.supabase.co/functions/v1/${FUNCTION_SLUG}")"
          [[ "$code" == "200" ]]
          jq -e '
            .ok == true and
            .sourceObjects == 3 and
            .sourceBytes == 9092490 and
            .recoveryObjects == 1 and
            .recoveryPrivate == true and
            .recoveryUserPolicies == 0 and
            .restoreProof == true and
            .restoreTestRemoved == true and
            .sourceUnchanged == true and
            .contentHashVerified == true
          ' "$response_file" >/dev/null
          echo "creator-media C2 backup and restore proof succeeded."

      - name: Remove temporary Edge Function
        if: always()
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${SUPABASE_ACCESS_TOKEN:-}" ]]
          body="$(mktemp)"
          delete_code="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            --request DELETE \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/functions/${FUNCTION_SLUG}")"
          case "$delete_code" in
            200|404) ;;
            *)
              echo "Temporary Edge Function cleanup failed with HTTP ${delete_code}." >&2
              exit 1
              ;;
          esac

          verify_body="$(mktemp)"
          verify_code="$(curl --silent --show-error --output "$verify_body" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/functions/${FUNCTION_SLUG}")"
          [[ "$verify_code" == "404" ]]
          echo "Temporary Edge Function removed."
