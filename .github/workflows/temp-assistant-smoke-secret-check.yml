name: TEMP Assistant smoke secret availability

on:
  push:
    branches:
      - tmp/assistant-runtime-1-smoke-20260917

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] && echo "SUPABASE_ACCESS_TOKEN=present" || echo "SUPABASE_ACCESS_TOKEN=missing"
          [ -n "$SUPABASE_PROJECT_REF" ] && echo "SUPABASE_PROJECT_REF=present" || echo "SUPABASE_PROJECT_REF=missing"
          [ -n "$OPENAI_API_KEY" ] && echo "OPENAI_API_KEY=present" || echo "OPENAI_API_KEY=missing"
