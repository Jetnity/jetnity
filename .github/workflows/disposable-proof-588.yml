name: Disposable Development proof 588
on:
  push:
    branches: [test/588-disposable-proof-only]
    paths:
      - .github/workflows/disposable-proof-588.yml
      - scripts/account/disposable-proof-588.mjs
permissions:
  contents: read
concurrency:
  group: disposable-development-proof-588
  cancel-in-progress: false
jobs:
  disposable-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact application source
        run: |
          git merge-base --is-ancestor ab0d38a4c7130a648514bd0f4b518c64e27992e6 HEAD
          git diff --exit-code ab0d38a4c7130a648514bd0f4b518c64e27992e6 HEAD -- app components lib supabase
          node --check scripts/account/disposable-proof-588.mjs
      - name: Run Development-only disposable proof with guaranteed cleanup
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/account/disposable-proof-588.mjs
