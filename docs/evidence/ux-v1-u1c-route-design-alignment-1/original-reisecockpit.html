<div id="jetnity-reisecockpit" lang="de">
<style>
#jetnity-reisecockpit .jp-app{--jp-bg:light-dark(#f5f5ef,#142923);--jp-surface:light-dark(#ffffff,#1d382e);--jp-text:light-dark(#173e33,#eaf5ed);--jp-muted:light-dark(#546b60,#bacfc2);--jp-line:light-dark(#d8e2da,#3b5b4c);--jp-soft:light-dark(#eaf1e9,#2c493b);--jp-brand:light-dark(#163d32,#c0e7cf);--jp-inverse:light-dark(#fff,#173b2e);--jp-accent:light-dark(#b9d968,#536e2d);--jp-warn:light-dark(#f8efdf,#4c4127);color:var(--jp-text);background:var(--jp-bg);font:16px/1.5 system-ui,sans-serif;border:1px solid var(--jp-line);border-radius:18px;overflow:clip;container-type:inline-size;min-width:0}
#jetnity-reisecockpit .jp-app *{box-sizing:border-box}
#jetnity-reisecockpit .jp-app button,#jetnity-reisecockpit .jp-app select{font:inherit;color:inherit}
#jetnity-reisecockpit .jp-app button{min-height:44px;padding:10px 13px;border:1px solid var(--jp-line);border-radius:11px;background:var(--jp-surface);white-space:normal;text-align:left;overflow-wrap:anywhere}
#jetnity-reisecockpit .jp-app button:hover{background:var(--jp-soft)}
#jetnity-reisecockpit .jp-app button.jp-primary{background:var(--jp-brand);color:var(--jp-inverse);border-color:var(--jp-brand)}
#jetnity-reisecockpit .jp-app p,#jetnity-reisecockpit .jp-app h2,#jetnity-reisecockpit .jp-app h3{margin:0}
#jetnity-reisecockpit .jp-app h2{font-size:1.6em;line-height:1.2;font-weight:650;letter-spacing:-.035em;overflow-wrap:anywhere}
#jetnity-reisecockpit .jp-app h3{font-size:1.1em;line-height:1.35;font-weight:650}
#jetnity-reisecockpit .jp-app svg{width:18px;height:18px;flex-shrink:0}
#jetnity-reisecockpit .jp-chrome{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--jp-surface);padding:14px 22px;border-bottom:1px solid var(--jp-line)}
#jetnity-reisecockpit .jp-wordmark{font-size:1.35em;font-weight:750;letter-spacing:-.05em}
#jetnity-reisecockpit .jp-demo{color:var(--jp-muted);font-size:.8em;padding-right:80px}
#jetnity-reisecockpit .jp-trip{padding:20px 24px 15px}
#jetnity-reisecockpit .jp-triprow{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
#jetnity-reisecockpit .jp-sub{color:var(--jp-muted);font-size:.85em;margin-top:6px!important}
#jetnity-reisecockpit .jp-trip details{font-size:.85em;margin-top:7px}
#jetnity-reisecockpit .jp-trip summary{min-height:44px;display:flex;align-items:center;gap:8px;list-style:none}
#jetnity-reisecockpit .jp-trip summary::before{content:'+';font-size:1.2em}
#jetnity-reisecockpit .jp-trip details[open] summary::before{content:'−'}
#jetnity-reisecockpit .jp-tabs{display:flex;padding:0 24px;gap:20px;border-bottom:1px solid var(--jp-line)}
#jetnity-reisecockpit .jp-tabs button{display:flex;align-items:center;justify-content:center;gap:8px;background:transparent;border:0;border-bottom:3px solid transparent;border-radius:0;padding:9px 1px;font-size:.9em;font-weight:550}
#jetnity-reisecockpit .jp-tabs button[aria-current="page"]{border-bottom-color:var(--jp-brand);color:var(--jp-text)}
#jetnity-reisecockpit .jp-content{padding:20px 24px 24px;min-height:520px;min-width:0}
#jetnity-reisecockpit .jp-plan-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;align-items:start}
#jetnity-reisecockpit .jp-route-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px}
#jetnity-reisecockpit .jp-route-title span{font-size:.8em;color:var(--jp-muted)}
#jetnity-reisecockpit .jp-timeline{display:grid;gap:4px}
#jetnity-reisecockpit .jp-stop{display:grid;grid-template-columns:32px minmax(0,1fr) auto;align-items:center;gap:9px;width:100%;border-color:transparent!important;background:transparent!important;padding:11px 8px!important}
#jetnity-reisecockpit .jp-stop[aria-pressed="true"]{background:var(--jp-surface)!important;border-color:var(--jp-line)!important}
#jetnity-reisecockpit .jp-stop b{display:block;font-size:1em;font-weight:600}
#jetnity-reisecockpit .jp-stop small{display:block;font-size:.8em;line-height:1.5;color:var(--jp-muted);margin-top:2px}
#jetnity-reisecockpit .jp-stop .jp-number{display:flex;justify-content:center;align-items:center;width:29px;height:29px;font-size:.8em;border-radius:50%;background:var(--jp-soft)}
#jetnity-reisecockpit .jp-transfer{margin-left:22px;border-left:1px solid var(--jp-line);padding:4px 0 4px 18px}
#jetnity-reisecockpit .jp-transfer button{display:flex;align-items:center;gap:8px;width:100%;font-size:.82em;background:transparent;border-color:transparent;padding:8px 10px}
#jetnity-reisecockpit .jp-transfer button[aria-pressed="true"]{background:var(--jp-warn);border-color:var(--jp-line)}
#jetnity-reisecockpit .jp-detail{background:var(--jp-surface);border:1px solid var(--jp-line);border-radius:16px;padding:21px;min-width:0}
#jetnity-reisecockpit .jp-detail h3{font-size:1.3em;letter-spacing:-.02em;margin-top:8px}
#jetnity-reisecockpit .jp-eyebrow{font-size:.75em;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--jp-muted)}
#jetnity-reisecockpit .jp-detail p{font-size:.9em;color:var(--jp-muted);margin-top:12px}
#jetnity-reisecockpit .jp-state{display:inline-flex;gap:7px;align-items:center;margin-top:14px;padding:5px 9px;border-radius:7px;background:var(--jp-soft);font-size:.8em}
#jetnity-reisecockpit .jp-detail button{display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px;font-size:.9em;margin-top:11px}
#jetnity-reisecockpit .jp-detail .jp-primary{margin-top:20px}
#jetnity-reisecockpit .jp-back{display:none!important}
#jetnity-reisecockpit .jp-section{max-width:780px}
#jetnity-reisecockpit .jp-action{background:var(--jp-surface);border:1px solid var(--jp-line);border-radius:14px;padding:18px;margin:15px 0}
#jetnity-reisecockpit .jp-action p{font-size:.9em;color:var(--jp-muted);margin:7px 0 13px}
#jetnity-reisecockpit .jp-organize-nav{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0}
#jetnity-reisecockpit .jp-organize-nav button{font-size:.85em;flex:1}
#jetnity-reisecockpit .jp-organize-nav button[aria-pressed="true"]{background:var(--jp-brand);color:var(--jp-inverse)}
#jetnity-reisecockpit .jp-filter{display:grid;gap:6px;margin:17px 0;font-size:.9em}
#jetnity-reisecockpit .jp-filter select{min-height:44px;background:var(--jp-surface);border:1px solid var(--jp-line);border-radius:10px;padding:10px;max-width:100%;width:100%}
#jetnity-reisecockpit .jp-rows{display:grid;margin-top:15px}
#jetnity-reisecockpit .jp-rows button{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;border-top:1px solid var(--jp-line);border-radius:0;background:transparent;padding:14px 0;font-size:.9em}
#jetnity-reisecockpit .jp-rows button span:last-child{font-size:.9em;color:var(--jp-muted)}
#jetnity-reisecockpit .jp-note{font-size:.85em;color:var(--jp-muted);padding:14px 0;border-top:1px solid var(--jp-line);margin-top:16px!important}
#jetnity-reisecockpit .jp-days{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}
#jetnity-reisecockpit .jp-days button{width:auto;min-width:44px;margin:0;justify-content:center;font-size:.85em}
#jetnity-reisecockpit .jp-days button[aria-pressed="true"]{background:var(--jp-brand);color:var(--jp-inverse)}
#jetnity-reisecockpit .jp-dayheading{font-size:.9em;font-weight:600;margin-top:18px!important}
#jetnity-reisecockpit .jp-app input{font:inherit;color:var(--jp-text);background:var(--jp-surface);border:1px solid var(--jp-line);border-radius:10px;min-height:44px;width:100%;padding:10px}
#jetnity-reisecockpit .jp-local-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}
#jetnity-reisecockpit .jp-feedback{border-left:3px solid var(--jp-brand);padding:12px 14px;margin:14px 0;font-size:.9em;background:var(--jp-soft);overflow-wrap:anywhere}
#jetnity-reisecockpit .jp-triprow>button{flex-shrink:0;font-size:.85em}
#jetnity-reisecockpit .jp-announcement{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#jetnity-reisecockpit .jp-mobile{max-width:390px;margin:0 auto;display:flex;flex-direction:column}
#jetnity-reisecockpit .jp-mobile .jp-demo{padding-right:0}
#jetnity-reisecockpit .jp-mobile .jp-chrome{padding:12px 15px}
#jetnity-reisecockpit .jp-mobile .jp-trip{padding:17px 16px 10px}
#jetnity-reisecockpit .jp-mobile h2{font-size:1.35em}
#jetnity-reisecockpit .jp-mobile .jp-tabs{order:3;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;padding:5px;border-top:1px solid var(--jp-line);border-bottom:0;background:var(--jp-surface)}
#jetnity-reisecockpit .jp-mobile .jp-tabs button{font-size:.72em;display:flex;flex-direction:column;gap:3px;min-height:58px;padding:6px 2px;border:0;border-radius:8px}
#jetnity-reisecockpit .jp-mobile .jp-tabs button[aria-current="page"]{background:var(--jp-brand);color:var(--jp-inverse)}
#jetnity-reisecockpit .jp-mobile .jp-content{padding:14px 16px;min-height:520px}
#jetnity-reisecockpit .jp-mobile .jp-plan-grid{display:block}
#jetnity-reisecockpit .jp-mobile .jp-detail{display:none}
#jetnity-reisecockpit .jp-mobile[data-detail="open"] .jp-route-pane{display:none}
#jetnity-reisecockpit .jp-mobile[data-detail="open"] .jp-detail{display:block}
#jetnity-reisecockpit .jp-mobile .jp-back{display:flex!important;border:0;padding:4px 0;margin:0 0 14px!important;background:transparent!important}
#jetnity-reisecockpit .jp-stage{min-height:800px}
@container(max-width:45em){#jetnity-reisecockpit .jp-plan-grid{grid-template-columns:1fr}#jetnity-reisecockpit .jp-tabs{gap:8px;justify-content:space-between}#jetnity-reisecockpit .jp-tabs button{flex:1;flex-wrap:wrap}#jetnity-reisecockpit .jp-trip,#jetnity-reisecockpit .jp-content{padding-left:16px;padding-right:16px}#jetnity-reisecockpit .jp-demo{padding-right:0}}
@container(max-width:24em){#jetnity-reisecockpit .jp-mobile .jp-tabs{grid-template-columns:1fr 1fr}#jetnity-reisecockpit .jp-mobile .jp-tabs button{flex-direction:row;font-size:.85em;min-height:44px}#jetnity-reisecockpit .jp-tabs{display:grid;grid-template-columns:1fr 1fr}#jetnity-reisecockpit .jp-stop{grid-template-columns:29px minmax(0,1fr)}#jetnity-reisecockpit .jp-stop>svg:last-child{display:none}#jetnity-reisecockpit .jp-chrome,#jetnity-reisecockpit .jp-triprow{flex-wrap:wrap}}
</style>
<div class="viz-carousel" aria-label="Jetnity Reisecockpit" data-previous-label="Vorheriger Entwurf" data-next-label="Nächster Entwurf">
<section class="jp-stage" data-variant="Desktop · Route und Details" aria-label="Reisecockpit am Desktop"><div class="jp-app jp-desktop" aria-label="Desktopgestaltung"></div></section>
<section class="jp-stage" data-variant="Mobil · Route und Rückkehr" aria-label="Reisecockpit auf dem Smartphone" hidden><div class="jp-app jp-mobile" aria-label="Mobilgestaltung"></div></section>
</div>
<script>
(()=>{
const root=document.getElementById('jetnity-reisecockpit');
const nav=[['overview','Übersicht','layout-dashboard'],['plan','Reiseplan','route'],['organize','Organisieren','briefcase'],['prepare','Vorbereitung','clipboard-check']];
const stops=[
 {id:'out',name:'Hinreise',date:'15. Nov. · geplanter Reisetag',icon:'plane-takeoff',kind:'Reisetag'},
 {id:'bkk',name:'Bangkok',date:'16.–22. Nov. · Thailand',number:'1',kind:'Aufenthalt'},
 {id:'kc',name:'Ko Chang',date:'23.–29. Nov. · Thailand',number:'2',kind:'Aufenthalt'},
 {id:'ph',name:'Phuket',date:'30. Nov.–5. Dez. · Thailand',number:'3',kind:'Aufenthalt'},
 {id:'back',name:'Rückreise',date:'6. Dez. · geplanter Reisetag',icon:'plane-landing',kind:'Reisetag'}
];
const legs={bkkkc:{name:'Bangkok → Ko Chang'},kcph:{name:'Ko Chang → Phuket'}};
const icon=n=>'<i data-lucide="'+n+'" aria-hidden="true"></i>';
for(const app of root.querySelectorAll('.jp-app')){
const state={section:'plan',selected:'kcph',domain:'Verbindungen',place:'Ko Chang',leg:'Ko Chang → Phuket',flight:'Hinreise',mobileDetail:false,title:'Thailand-Rundreise',editing:null,preview:false,roleDraft:'',roles:{out:'Hinreise',back:'Rückreise'},days:{Bangkok:16,'Ko Chang':23,Phuket:30},search:'idle',notice:''};
const design={fontSize:16,searchResult:'Keine Treffer'};
const dayLabels={Bangkok:[16,17,18,19,20,21,22],'Ko Chang':[23,24,25,26,27,28,29],Phuket:[30,1,2,3,4,5]};
const dayText=(place,day)=>day+'. '+(place==='Phuket'&&day<10?'Dezember':'November');
app.innerHTML='<div class="jp-chrome"><span class="jp-wordmark">Jetnity</span><span class="jp-demo">Entwurf · Beispieldaten</span></div><header class="jp-trip"><div class="jp-triprow"><div><h2>Thailand-Rundreise</h2><p class="jp-sub">15. Nov.–6. Dez. 2026 · 3 Orte · 22 Tage</p></div></div><details><summary>Reisedaten</summary><p class="jp-sub">Beispielreise für 2 Personen. Die Route ist geplant; Buchungen sind nicht bestätigt.</p></details></header><nav class="jp-tabs" aria-label="Reisebereiche">'+nav.map(([id,label,i])=>'<button type="button" class="cursor-interaction" data-section="'+id+'">'+icon(i)+'<span>'+label+'</span></button>').join('')+'</nav><div class="jp-content" aria-live="polite"></div>';
const content=app.querySelector('.jp-content');
content.removeAttribute('aria-live');
app.insertAdjacentHTML('beforeend','<span class="jp-announcement" aria-live="polite"></span>');
app.querySelector('.jp-triprow').insertAdjacentHTML('beforeend','<button type="button" class="cursor-interaction" data-edit-title>Reise ändern</button>');
function focusAfter(selector){requestAnimationFrame(()=>{const t=app.querySelector(selector);if(t)t.focus({preventScroll:true});});}
function dayButtons(place){return '<div class="jp-days" aria-label="Tag in '+place+'">'+dayLabels[place].map(d=>'<button type="button" class="cursor-interaction" data-day="'+d+'" aria-label="'+dayText(place,d)+'" aria-pressed="'+(state.days[place]===d)+'">'+d+'.</button>').join('')+'</div><p class="jp-dayheading">'+dayText(place,state.days[place])+': frei geplant</p><p>Noch keine Planpunkte. Du kannst den Tag bewusst frei lassen.</p>';}
function editor(){const isTitle=state.editing==='title';const current=isTitle?state.title:state.roles[state.editing];const draft=isTitle?state.titleDraft:state.roleDraft;return '<div class="jp-section"><h3>'+(isTitle?'Reisetitel ändern':'Reisetag einordnen')+'</h3>'+(state.preview?'<section class="jp-action"><span class="jp-eyebrow">Änderungsvorschau</span><h3>'+escapeText(current)+' → '+escapeText(draft)+'</h3><p>'+(isTitle?'Termine, Route und Planpunkte bleiben erhalten.':'Die Einordnung beschreibt deine Planung. Sie bestätigt keinen Flug und verändert keine Reisezeiten.')+'</p><div class="jp-local-actions"><button type="button" class="jp-primary cursor-interaction" data-accept-edit>Im Entwurf übernehmen</button><button type="button" class="cursor-interaction" data-revise>Weiter bearbeiten</button></div></section>':isTitle?'<label class="jp-filter">Reisetitel<input data-title-input value="'+escapeText(state.titleDraft)+'" maxlength="100"></label><button type="button" class="jp-primary cursor-interaction" data-preview-edit>Änderung prüfen</button>':'<label class="jp-filter">Planung für diesen Tag<select data-role-input>'+['Hinreise','Rückreise','Weiterreise','Noch nicht eingeordnet'].map(x=>'<option'+(x===state.roleDraft?' selected':'')+'>'+x+'</option>').join('')+'</select></label><button type="button" class="jp-primary cursor-interaction" data-preview-edit>Änderung prüfen</button>')+'<div class="jp-local-actions"><button type="button" class="cursor-interaction" data-cancel-edit>Abbrechen</button></div><p class="jp-note">Interaktiver Entwurf · Änderungen bleiben nur in dieser Vorschau.</p></div>';}
function escapeText(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function detail(){
 if(legs[state.selected]){const leg=legs[state.selected];return '<button type="button" class="jp-back cursor-interaction" data-back>'+icon('arrow-left')+'Zur Route</button><span class="jp-eyebrow">Weiterreise</span><h3>'+leg.name+'</h3><span class="jp-state">'+icon('circle-dashed')+'Noch zu planen</span><p>Für diesen Abschnitt ist in der Beispielreise noch keine Verbindung hinterlegt.</p><button type="button" class="jp-primary cursor-interaction" data-section="organize" data-domain="Verbindungen">Verbindung organisieren'+icon('arrow-right')+'</button><p>Fahrtzeit, Preis und Verfügbarkeit sind noch nicht bekannt.</p>';}
 const stop=stops.find(s=>s.id===state.selected);
 return '<button type="button" class="jp-back cursor-interaction" data-back>'+icon('arrow-left')+'Zur Route</button><span class="jp-eyebrow">'+stop.kind+'</span><h3>'+(state.roles[stop.id]||stop.name)+'</h3><p>'+stop.date+'</p><span class="jp-state">'+icon('pencil')+'Geplant</span>'+(stop.kind==='Aufenthalt'?dayButtons(stop.name)+'<button type="button" class="jp-primary cursor-interaction" data-section="organize" data-domain="Aktivitäten">Aktivitäten für '+stop.name+icon('arrow-right')+'</button><button type="button" class="cursor-interaction" data-section="organize" data-domain="Unterkünfte">Unterkunft organisieren'+icon('arrow-right')+'</button>':'<p>Die Einordnung beschreibt deine Planung. Buchung und genaue Reisezeit sind damit nicht bestätigt.</p><button type="button" class="jp-primary cursor-interaction" data-section="organize" data-domain="Flüge">Flug organisieren'+icon('arrow-right')+'</button><button type="button" class="cursor-interaction" data-edit-role="'+stop.id+'">Einordnung ändern</button>');
}
function plan(){
 let list='';
 for(const s of stops){list+='<button type="button" class="jp-stop cursor-interaction" data-select="'+s.id+'" aria-pressed="'+(state.selected===s.id)+'"><span class="jp-number">'+(s.icon?icon(s.icon):s.number)+'</span><span><b>'+(state.roles[s.id]||s.name)+'</b><small>'+s.date+'</small></span>'+icon('chevron-right')+'</button>';const legId=s.id==='bkk'?'bkkkc':s.id==='kc'?'kcph':null;if(legId)list+='<div class="jp-transfer"><button type="button" class="cursor-interaction" data-select="'+legId+'" aria-pressed="'+(state.selected===legId)+'">'+icon('arrow-down')+'Weiterreise planen</button></div>';}
 return '<div class="jp-plan-grid"><div class="jp-route-pane"><div class="jp-route-title"><h3>Deine Route</h3><span>Geplanter Ablauf</span></div><div class="jp-timeline">'+list+'</div></div><aside class="jp-detail" aria-label="Details zum ausgewählten Reiseabschnitt">'+detail()+'</aside></div>';
}
function organize(){
 const kind=state.domain==='Verbindungen'?'leg':state.domain==='Flüge'?'flight':'place';
 const options=kind==='leg'?Object.values(legs).map(x=>x.name):kind==='flight'?['Hinreise','Rückreise']:['Bangkok','Ko Chang','Phuket'];
 const label=kind==='place'?'Ort':'Reiseabschnitt';
 let result=state.search==='loading'?'<p role="status">Beispielsuche wird geladen …</p>':state.search==='error'?'<div class="jp-feedback" role="alert">Suche konnte nicht geladen werden. Dein Reiseplan bleibt erhalten.</div><button type="button" class="cursor-interaction" data-search>Erneut versuchen</button>':state.search==='empty'?'<div class="jp-feedback" role="status">Keine Treffer für diese Beispielsuche. Dein Tag kann frei bleiben.</div><button type="button" class="cursor-interaction" data-search>Erneut suchen</button>':'<p>Noch keine Suche gestartet.</p><button type="button" class="jp-primary cursor-interaction" data-search>Beispielsuche anzeigen</button>';
 return '<div class="jp-section"><h3>'+state.domain+' organisieren</h3><div class="jp-organize-nav">'+['Flüge','Unterkünfte','Aktivitäten','Verbindungen'].map(s=>'<button type="button" class="cursor-interaction" data-domain="'+s+'" aria-pressed="'+(state.domain===s)+'">'+s+'</button>').join('')+'</div><label class="jp-filter">'+label+'<select class="cursor-interaction" data-context="'+kind+'" aria-label="'+label+'">'+options.map(s=>'<option'+(s===state[kind]?' selected':'')+'>'+s+'</option>').join('')+'</select></label><section class="jp-action"><h3 data-context-heading>'+state[kind]+'</h3>'+(state.domain==='Aktivitäten'?'<p>'+dayText(state.place,state.days[state.place])+' · Beispielzustand</p>'+result:kind==='leg'?'<span class="jp-state">12Go · externe Suche</span><p>Strecke und Reisedatum bei 12Go selbst auswählen. Hier werden keine passenden Angebote oder Preise behauptet.</p><p>Die Vorschau öffnet keine Anbieterwebsite.</p>':'<p>Geplante Einträge und verfügbare Anbietersuchen würden hier zum gewählten Kontext erscheinen.</p>')+'</section><button type="button" class="cursor-interaction" data-return-detail>'+icon('arrow-left')+' Zum gewählten Abschnitt</button></div>';
}
function overview(){return '<div class="jp-section"><h3>Deine Reise im Überblick</h3><p class="jp-sub">Bangkok → Ko Chang → Phuket</p><section class="jp-action"><span class="jp-eyebrow">Nächster Schritt im Beispiel</span><h3>Weiterreise nach Phuket planen</h3><p>Für Ko Chang → Phuket ist noch keine Verbindung hinterlegt.</p><button type="button" class="jp-primary cursor-interaction" data-select="kcph">Abschnitt ansehen</button></section><div class="jp-rows"><button type="button" class="cursor-interaction" data-section="plan"><strong>Route und Reisetage</strong>'+icon('arrow-right')+'</button><button type="button" class="cursor-interaction" data-section="organize"><strong>Reise organisieren</strong>'+icon('arrow-right')+'</button><button type="button" class="cursor-interaction" data-section="prepare"><strong>Vorbereitung</strong><span>Angaben ergänzen</span></button></div><p class="jp-note">Geplant bedeutet nicht gebucht. Fehlende Anbieter- oder Behördeninformationen bleiben als offen erkennbar.</p></div>';}
function prepare(){return '<div class="jp-section"><h3>Vorbereitung</h3><section class="jp-action"><h3>Angaben zu Reisenden ergänzen</h3><p>Für die persönliche Vorbereitung sind im Beispiel noch nicht alle Angaben vorhanden.</p></section><section class="jp-action"><h3>Thailand</h3><p>Ein Reiseland · Bangkok, Ko Chang und Phuket</p><span class="jp-state">Automatische Prüfung nicht verfügbar</span><p>Einreiseinformationen werden gemeinsam zugeordnet. Regionale Unterschiede bleiben beim jeweiligen Ort sichtbar, sobald verlässliche Hinweise vorliegen.</p></section><p class="jp-note">Eine Aus- und spätere Wiedereinreise wäre ein eigener Vorgang. Eine fehlende Prüfung bedeutet keine bestätigte Einreiseberechtigung.</p></div>';}
function render(){
 app.querySelector('.jp-trip h2').textContent=state.title;
 app.dataset.detail=state.mobileDetail?'open':'closed';
 for(const b of app.querySelectorAll('.jp-tabs button')){if(b.dataset.section===state.section)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');}
 content.innerHTML=state.editing?editor():state.section==='plan'?plan():state.section==='organize'?organize():state.section==='prepare'?prepare():overview();
 if(state.notice)content.insertAdjacentHTML('afterbegin','<p class="jp-feedback" role="status">'+escapeText(state.notice)+'</p>');
 app.querySelector('.jp-announcement').textContent=state.editing?(state.preview?'Änderungsvorschau':'Änderung bearbeiten'):nav.find(n=>n[0]===state.section)[1]+(state.section==='plan'?' · '+(legs[state.selected]?.name||state.roles[state.selected]||stops.find(s=>s.id===state.selected)?.name):'');
 if(globalThis.lucide)lucide.createIcons();
}
app.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||!app.contains(b))return;
 state.notice='';
 if(b.hasAttribute('data-back')){state.mobileDetail=false;render();focusAfter('[data-select="'+state.selected+'"]');return;}
 if(b.hasAttribute('data-edit-title')){state.editing='title';state.titleDraft=state.title;state.preview=false;render();focusAfter('[data-title-input]');return;}
 if(b.dataset.editRole){state.editing=b.dataset.editRole;state.roleDraft=state.roles[state.editing];state.preview=false;render();focusAfter('[data-role-input]');return;}
 if(b.hasAttribute('data-preview-edit')){if(state.editing==='title'&&!state.titleDraft.trim()){state.notice='Bitte einen Reisetitel eingeben.';render();focusAfter('[data-title-input]');return;}state.preview=true;render();focusAfter('[data-accept-edit]');return;}
 if(b.hasAttribute('data-revise')){state.preview=false;render();focusAfter(state.editing==='title'?'[data-title-input]':'[data-role-input]');return;}
 if(b.hasAttribute('data-cancel-edit')||b.hasAttribute('data-accept-edit')){const wasTitle=state.editing==='title';if(b.hasAttribute('data-accept-edit')){if(wasTitle)state.title=state.titleDraft.trim();else state.roles[state.editing]=state.roleDraft;state.notice='In dieser Vorschau übernommen.';}state.editing=null;render();focusAfter(wasTitle?'[data-edit-title]':'[data-edit-role]');return;}
 if(b.hasAttribute('data-return-detail')){state.section='plan';state.mobileDetail=true;render();focusAfter(app.classList.contains('jp-mobile')?'[data-back]':'.jp-detail .jp-primary');return;}
 if(b.dataset.day){state.days[state.place]=Number(b.dataset.day);state.search='idle';render();focusAfter('[data-day="'+b.dataset.day+'"]');return;}
 if(b.hasAttribute('data-search')){state.search='loading';const place=state.place;const day=state.days[place];render();setTimeout(()=>{if(state.place!==place||state.days[place]!==day||state.search!=='loading')return;state.search=design.searchResult==='Ladefehler'?'error':'empty';if(state.section==='organize')render();},450);return;}
 state.editing=null;
 if(b.dataset.select){state.selected=b.dataset.select;state.section='plan';state.mobileDetail=true;const stop=stops.find(s=>s.id===state.selected);if(stop&&stop.kind==='Aufenthalt')state.place=stop.name;if(stop&&stop.kind==='Reisetag')state.flight=stop.name;if(legs[state.selected])state.leg=legs[state.selected].name;}
 if(b.dataset.section){state.section=b.dataset.section;state.mobileDetail=false;}
 if(b.dataset.domain){state.domain=b.dataset.domain;state.section='organize';state.mobileDetail=false;}
 render();
 if(b.dataset.select)focusAfter(app.classList.contains('jp-mobile')?'[data-back]':'.jp-detail .jp-primary');
 else if(b.dataset.section)focusAfter('.jp-tabs [data-section="'+state.section+'"]');
 else if(b.dataset.domain)focusAfter('.jp-organize-nav [data-domain="'+state.domain+'"]');
});
app.addEventListener('input',e=>{if(e.target.matches('[data-title-input]'))state.titleDraft=e.target.value;});
app.addEventListener('change',e=>{if(e.target.matches('[data-role-input]'))state.roleDraft=e.target.value;if(e.target.matches('select[data-context]')){const k=e.target.dataset.context;state[k]=e.target.value;state.search='idle';if(k==='place')state.selected=stops.find(s=>s.name===state.place).id;if(k==='leg')state.selected=Object.keys(legs).find(id=>legs[id].name===state.leg);if(k==='flight')state.selected=state.flight==='Hinreise'?'out':'back';render();focusAfter('[data-context="'+k+'"]');}});
render();
if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:()=>{app.style.fontSize=design.fontSize+'px';if(state.search==='empty'||state.search==='error')state.search=design.searchResult==='Ladefehler'?'error':'empty';render();}});tweak.addSlider(design,'fontSize',{label:'Textgröße',min:16,max:32,step:2,unit:'px'});tweak.addSelect(design,'searchResult',{label:'Beispielsuche endet mit',options:['Keine Treffer','Ladefehler']});}
}
})();
</script>
</div>
